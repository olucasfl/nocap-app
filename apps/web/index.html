<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F4EF" />
    <script>
      // Aplica a escolha de tema antes da primeira pintura (sem flash claro no escuro).
      // Só Claro ou Escuro: sem escolha salva, começa pelo tema do sistema.
      var t = null;
      try {
        t = localStorage.getItem('nocap-theme');
      } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    </script>
    <style>
      /*
       * Splash do app instalado (PWA). Cores literais: o CSS do app ainda não chegou. Só anima
       * transform e opacity. Sequência (~2 s): quatro amostras caem e formam a grade, as letras do
       * logo sobem uma a uma, o "!" quica em laranja, a frase aparece e a barra enche; no fim a
       * tela cresce um pouco e some.
       */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: #f4f4ef;
        color: #111;
        overflow: hidden;
        transition:
          opacity 0.35s ease-out,
          transform 0.35s ease-out;
      }
      [data-theme='dark'] #splash {
        background: #14140f;
        color: #f4f4ef;
      }
      #splash.out {
        opacity: 0;
        transform: scale(1.06);
        pointer-events: none;
      }
      /* Brilho de fundo: um disco colorido que respira atrás do logo */
      #splash .sp-glow {
        position: absolute;
        width: 420px;
        height: 420px;
        left: 50%;
        top: 50%;
        margin: -230px 0 0 -210px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 106, 43, 0.28) 0%, rgba(255, 106, 43, 0) 65%);
        animation: sp-breathe 2.4s ease-in-out infinite;
      }
      /* Grade 2x2 de amostras (as quatro cores do app) */
      #splash .sp-tiles {
        position: relative;
        display: grid;
        grid-template-columns: repeat(2, 38px);
        gap: 10px;
        transform: rotate(-6deg);
      }
      #splash .sp-tiles i {
        width: 38px;
        height: 38px;
        border: 3px solid currentColor;
        border-radius: 10px;
        box-shadow: 4px 4px 0 currentColor;
        animation:
          sp-drop 0.55s cubic-bezier(0.2, 1.5, 0.4, 1) both,
          sp-hop 1.1s ease-in-out 1.2s infinite;
      }
      #splash .sp-tiles i:nth-child(1) {
        background: #ff6a2b;
        animation-delay: 0.05s, 1.2s;
      }
      #splash .sp-tiles i:nth-child(2) {
        background: #2f5bff;
        animation-delay: 0.17s, 1.32s;
      }
      #splash .sp-tiles i:nth-child(3) {
        background: #ffd23f;
        animation-delay: 0.29s, 1.44s;
      }
      #splash .sp-tiles i:nth-child(4) {
        background: #33c27f;
        animation-delay: 0.41s, 1.56s;
      }
      /* Logo: cada letra sobe de uma máscara; o "!" quica por último */
      #splash .sp-logo {
        display: flex;
        font:
          italic 900 60px/1 'Archivo',
          'Arial Black',
          system-ui,
          sans-serif;
        letter-spacing: -0.05em;
        text-transform: uppercase;
      }
      #splash .sp-logo span {
        display: inline-block;
        animation: sp-rise 0.6s cubic-bezier(0.2, 1.4, 0.4, 1) both;
        animation-delay: calc(0.55s + var(--i) * 0.055s);
      }
      #splash .sp-logo .sp-gap {
        width: 0.28em;
      }
      #splash .sp-logo .sp-bang {
        color: #ff6a2b;
        transform-origin: 50% 100%;
        animation:
          sp-rise 0.6s cubic-bezier(0.2, 1.4, 0.4, 1) both,
          sp-bounce 1.4s ease-in-out 1.3s infinite;
        animation-delay: 0.95s, 1.3s;
      }
      #splash .sp-tag {
        font:
          700 11px/1 'Space Mono',
          ui-monospace,
          monospace;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        opacity: 0;
        animation: sp-fade 0.5s ease-out 1.15s both;
      }
      /* Barra de carregamento: enche por scaleX (só transform) */
      #splash .sp-bar {
        width: 150px;
        height: 12px;
        border: 3px solid currentColor;
        border-radius: 999px;
        overflow: hidden;
        opacity: 0;
        animation: sp-fade 0.4s ease-out 1.05s both;
      }
      #splash .sp-bar i {
        display: block;
        width: 100%;
        height: 100%;
        background: #ff6a2b;
        transform-origin: left center;
        transform: scaleX(0);
        animation: sp-fill 1.15s cubic-bezier(0.3, 0.6, 0.3, 1) 1.05s forwards;
      }
      @keyframes sp-drop {
        from {
          transform: translateY(-90px) scale(0.3) rotate(-40deg);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      @keyframes sp-hop {
        0%,
        55%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        28% {
          transform: translateY(-9px) rotate(8deg);
        }
      }
      @keyframes sp-rise {
        from {
          transform: translateY(70%) rotate(8deg);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      @keyframes sp-bounce {
        0%,
        50%,
        100% {
          transform: translateY(0) scale(1, 1);
        }
        20% {
          transform: translateY(-12px) scale(0.92, 1.12);
        }
        35% {
          transform: translateY(0) scale(1.12, 0.88);
        }
      }
      @keyframes sp-fade {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes sp-fill {
        to {
          transform: scaleX(1);
        }
      }
      @keyframes sp-breathe {
        0%,
        100% {
          transform: scale(0.9);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }
      @media (min-width: 768px) {
        #splash .sp-logo {
          font-size: 84px;
        }
        #splash .sp-tiles {
          grid-template-columns: repeat(2, 48px);
        }
        #splash .sp-tiles i {
          width: 48px;
          height: 48px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash,
        #splash * {
          animation: none !important;
          transition: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
        #splash .sp-bar i {
          transform: scaleX(1) !important;
        }
      }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NoCap" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Jogos para jogar com amigos: Cor, Tempo e salas em tempo real."
    />
    <meta name="application-name" content="NoCap" />
    <!-- Ícones da marca (brand/README.md): navegador, iPhone, Safari fixado e Windows -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#FF6A2B" />
    <meta name="msapplication-TileColor" content="#FF6A2B" />
    <meta name="msapplication-TileImage" content="/pwa-192x192.png" />
    <!-- Prévia ao compartilhar o link (a URL absoluta da imagem entra no build: VITE_SITE_URL) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NoCap" />
    <meta property="og:title" content="NoCap" />
    <meta property="og:description" content="Jogos para jogar com amigos." />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NoCap" />
    <meta name="twitter:description" content="Jogos para jogar com amigos." />
    <title>NoCap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,700;0,900;1,900&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Splash só no PWA instalado (janela própria, sem barra do navegador). `?splash` força, para testar.
      (function () {
        var standalone =
          window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true ||
          location.search.indexOf('splash') !== -1;
        if (!standalone) return;
        var el = document.createElement('div');
        el.id = 'splash';
        el.setAttribute('role', 'status');
        el.setAttribute('aria-label', 'Carregando o NoCap');
        el.innerHTML =
          '<div class="sp-glow"></div>' +
          '<div class="sp-tiles" aria-hidden="true"><i></i><i></i><i></i><i></i></div>' +
          '<div class="sp-logo" aria-hidden="true">' +
          'NO CAP'
            .split('')
            .map(function (c, n) {
              return c === ' '
                ? '<span class="sp-gap" style="--i:' + n + '"></span>'
                : '<span style="--i:' + n + '">' + c + '</span>';
            })
            .join('') +
          '<span class="sp-bang" style="--i:6">!</span></div>' +
          '<div class="sp-tag">Jogos para jogar com amigos</div>' +
          '<div class="sp-bar" aria-hidden="true"><i></i></div>';
        document.body.insertBefore(el, document.body.firstChild);
        window.__splashAt = Date.now();
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
