<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F4EF" />
    <script>
      // Aplica a escolha de tema antes da primeira pintura (sem flash claro no escuro).
      // Só Claro ou Escuro: sem escolha salva, começa pelo tema do sistema.
      var t = null;
      try {
        t = localStorage.getItem('nocap-theme');
      } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    </script>
    <style>
      /* Splash: só no app instalado (PWA). Cores literais porque o CSS do app ainda não chegou. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #f4f4ef;
        color: #111;
        transition: opacity 0.25s ease-out;
      }
      [data-theme='dark'] #splash {
        background: #14140f;
        color: #f4f4ef;
      }
      #splash.out {
        opacity: 0;
        pointer-events: none;
      }
      #splash b {
        font: italic 900 56px/1 'Archivo', 'Arial Black', system-ui, sans-serif;
        letter-spacing: -0.04em;
        text-transform: uppercase;
      }
      #splash b span {
        color: #ff6a2b;
      }
      #splash .sp-dots {
        display: flex;
        gap: 10px;
        height: 40px;
        align-items: flex-end;
      }
      #splash .sp-dots i {
        width: 22px;
        height: 22px;
        border: 3px solid currentColor;
        border-radius: 6px;
        animation: sp-hop 0.9s ease-in-out infinite;
      }
      #splash .sp-dots i:nth-child(1) { background: #ff6a2b; }
      #splash .sp-dots i:nth-child(2) { background: #2f5bff; animation-delay: 0.12s; }
      #splash .sp-dots i:nth-child(3) { background: #ffd23f; animation-delay: 0.24s; }
      #splash .sp-dots i:nth-child(4) { background: #33c27f; animation-delay: 0.36s; }
      @keyframes sp-hop {
        0%, 60%, 100% { transform: translateY(0) rotate(0deg); }
        30% { transform: translateY(-16px) rotate(12deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .sp-dots i { animation: none; }
        #splash { transition: none; }
      }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NoCap" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Jogos para jogar com amigos: Cor, Tempo e salas em tempo real." />
    <meta name="application-name" content="NoCap" />
    <!-- Ícones da marca (brand/README.md): navegador, iPhone, Safari fixado e Windows -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#FF6A2B" />
    <meta name="msapplication-TileColor" content="#FF6A2B" />
    <meta name="msapplication-TileImage" content="/pwa-192x192.png" />
    <!-- Prévia ao compartilhar o link (a URL absoluta da imagem entra no build: VITE_SITE_URL) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NoCap" />
    <meta property="og:title" content="NoCap" />
    <meta property="og:description" content="Jogos para jogar com amigos." />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NoCap" />
    <meta name="twitter:description" content="Jogos para jogar com amigos." />
    <title>NoCap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,700;0,900;1,900&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Splash só no PWA instalado (janela própria, sem barra do navegador). `?splash` força, para testar.
      (function () {
        var standalone =
          window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true ||
          location.search.indexOf('splash') !== -1;
        if (!standalone) return;
        var el = document.createElement('div');
        el.id = 'splash';
        el.setAttribute('role', 'status');
        el.setAttribute('aria-label', 'Carregando o NoCap');
        el.innerHTML =
          '<b>no cap<span>!</span></b><div class="sp-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>';
        document.body.insertBefore(el, document.body.firstChild);
        window.__splashAt = Date.now();
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
