<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F4EF" />
    <script>
      // Aplica a escolha de tema antes da primeira pintura (sem flash claro no escuro).
      // Só Claro ou Escuro: sem escolha salva, começa pelo tema do sistema.
      var t = null;
      try {
        t = localStorage.getItem('nocap-theme');
      } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NoCap" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Jogos para jogar com amigos: Cor, Tempo e salas em tempo real." />
    <meta name="application-name" content="NoCap" />
    <!-- Ícones da marca (brand/README.md): navegador, iPhone, Safari fixado e Windows -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#FF6A2B" />
    <meta name="msapplication-TileColor" content="#FF6A2B" />
    <meta name="msapplication-TileImage" content="/pwa-192x192.png" />
    <!-- Prévia ao compartilhar o link (a URL absoluta da imagem entra no build: VITE_SITE_URL) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NoCap" />
    <meta property="og:title" content="NoCap" />
    <meta property="og:description" content="Jogos para jogar com amigos." />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NoCap" />
    <meta name="twitter:description" content="Jogos para jogar com amigos." />
    <title>NoCap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,700;0,900;1,900&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
