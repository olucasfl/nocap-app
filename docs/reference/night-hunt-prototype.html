<style>
/* Layout: canvas em resolucao real do aparelho (texto nitido), mundo em pixel art com escala inteira, barra de revisao embaixo. */
:root{--ink:#070b14;--ink2:#0c1424;--plum:#16233a;--violet:#2b8aa0;--gold:#ffb23e;--gold2:#2b8aa0;--bone:#e6eef2}
html,body{height:100%;margin:0;background:var(--ink);color:var(--bone);overflow:hidden}
body{display:flex;flex-direction:column;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#stage{flex:1;min-height:0;position:relative}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#nav{display:flex;gap:5px;justify-content:center;align-items:center;padding:5px 8px;background:var(--ink2);border-top:2px solid var(--gold2);flex-wrap:wrap}
#nav span{font:600 12px "Barlow Condensed",sans-serif;color:var(--gold2);letter-spacing:.08em;text-transform:uppercase;margin-right:2px}
#nav button{font:600 14px "Barlow Condensed",sans-serif;background:var(--plum);color:var(--bone);border:2px solid var(--violet);padding:3px 8px;cursor:pointer;min-height:28px}
#nav button[aria-pressed="true"]{background:#17829f;border-color:var(--gold);color:#fff}
#nav button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
